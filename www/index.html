<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de Gift Cards</title>
    
    <script src="librerias/html5-qrcode.min.js" type="text/javascript"></script>
    <script src="librerias/jspdf.umd.min.js"></script>
    <script src="librerias/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg-pastel: #fdfbf7; --primary-pastel: #a3c4f3; --secondary-pastel: #f1c0e8;
            --text-color: #4a4e69; --card-bg: #ffffff; --ok-bg: #d4edda;
            --ok-border: #c3e6cb; --ok-text: #155724; --error-bg: #f8d7da;
            --error-border: #f5c6cb; --error-text: #721c24;
        }

        body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background-color: var(--bg-pastel); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; user-select: none; }
        header { background-color: var(--card-bg); padding: 15px 20px; text-align: center; border-bottom: 4px solid var(--primary-pastel); }
        header h2 { margin: 0; font-size: 1.4rem; }
        .contenedor-principal { flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px; width: 100%; max-width: 700px; margin: 0 auto; box-sizing: border-box; }
        .panel-config, .panel { background-color: var(--card-bg); border-radius: 15px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 15px; align-items: center; width: 100%; box-sizing: border-box; }
        .panel-titulo { margin-top: 0; font-size: 1.1rem; margin-bottom: 15px; }
        .btn-accion { display: inline-block; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; width: 100%; border: 2px solid; box-sizing: border-box; font-size: 1rem; }
        #reader { width: 100%; min-height: 250px; border-radius: 8px; overflow: hidden; background: #fff; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background-color: var(--card-bg); width: 90%; max-width: 400px; border-radius: 15px; padding: 20px; text-align: center; }
        #resultado-box { padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; }
        .info-tarjeta { display: none; padding: 15px; background-color: #f4f6f9; border-radius: 10px; border-left: 5px solid var(--secondary-pastel); text-align: left; }
        .info-tarjeta p { margin: 8px 0; font-size: 0.95rem; }
        input[type="number"], select { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem; }
        .export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 10px; }
        footer { text-align: center; padding: 15px; font-size: 0.85rem; color: #6c757d; background-color: var(--card-bg); margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <h2>🎁 Sistema de Gift Cards V8</h2>
    </header>

    <div class="contenedor-principal">
        <div class="panel-config">
            <div style="display: flex; gap: 10px; width: 100%;">
                <button onclick="sincronizarDesdeGoogle()" class="btn-accion" style="background-color: #d4edda; border-color: #c3e6cb; color: #155724;">🔄 Sincronizar Tarjetas</button>
                <button onclick="mostrarHistorial()" class="btn-accion" style="background-color: #d1ecf1; border-color: #bee5eb; color: #0c5460;">📊 Resumen General</button>
            </div>
            <button id="btn-volver" onclick="cerrarHistorial()" class="btn-accion" style="display: none; background-color: #f8d7da; border-color: #f5c6cb; color: #721c24;">🔙 Volver al Escáner</button>
        </div>

        <div class="panel" id="panel-escaneo">
            <h3 class="panel-titulo">Escanear Tarjeta</h3>
            <div id="reader"></div>
        </div>

        <div class="panel" id="historial-panel" style="display: none;">
            <h3 class="panel-titulo">Exportar Reporte de Ventas</h3>
            <div style="width: 100%; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 20px;">
                <label for="filtro-tiempo" style="font-weight: bold; font-size: 0.9rem;">Filtrar transacciones por fecha:</label>
                <select id="filtro-tiempo">
                    <option value="hoy">📅 Solo Hoy</option>
                    <option value="semana">📆 Última Semana (7 días)</option>
                    <option value="quincena">🗓️ Última Quincena (15 días)</option>
                    <option value="mes">📅 Último Mes (30 días)</option>
                    <option value="todo">📂 Historial Histórico Completo</option>
                </select>
                <div class="export-grid">
                    <button id="btn-csv" onclick="exportarReporte('csv')" class="btn-accion" style="background-color: #28a745; color: white; border: none;">📥 Exportar CSV</button>
                    <button id="btn-pdf" onclick="exportarReporte('pdf')" class="btn-accion" style="background-color: #dc3545; color: white; border: none;">📄 Exportar PDF</button>
                </div>
            </div>

            <h3 class="panel-titulo">Estado Actual de Tarjetas</h3>
            <div id="lista-tarjetas" style="width: 100%; text-align: left;"></div>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div id="resultado-box"></div>
            <div id="info-tarjeta" class="info-tarjeta">
                <p><strong>💳 Tarjeta ID:</strong> <span id="dato-id"></span></p>
                <p><strong>💰 Monto Inicial:</strong> $<span id="dato-inicial"></span></p>
                <p><strong>📅 Vencimiento:</strong> <span id="dato-vencimiento"></span></p>
                <p><strong>💵 Saldo Disponible:</strong> $<span id="dato-saldo" style="color: green; font-weight: bold;"></span></p>
                
                <div style="margin-top: 15px; border-top: 1px solid #dee2e6; padding-top: 10px;">
                    <label for="charge-amount" style="font-size: 0.9rem; font-weight: bold;">Descontar Monto:</label>
                    <input type="number" id="charge-amount" placeholder="Ej: 100">
                    <button onclick="cobrarSaldo()" class="btn-accion" style="background-color: #007bff; border-color: #0056b3; color: white; margin-top: 10px;">Descontar Saldo</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        Sistema de Gift Cards - Offline Ready
    </footer>

    <script>
        let baseDeDatosTarjetas = {};
        let escaneoPausado = false;
        let html5QrcodeScanner = null;
        let tarjetaActualId = null;

        const modalOverlay = document.getElementById('modal-overlay');
        const resultadoBox = document.getElementById('resultado-box');
        const infoTarjetaBox = document.getElementById('info-tarjeta');

        const URL_GOOGLE_SHEET_TARJETAS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSjIH2cId6_HAo4GWJvSkvmmyrwabBEp0HpV59dYtEjcK4EGOONCXBJqIX87TR74v82RDPNXePuMbgi/pub?output=csv"; 
        const URL_APPS_SCRIPT_TRANSACCIONES = "https://script.google.com/macros/s/AKfycbyBlKVhSwyNxLt2xCzGRYw97Seo-9mHn0UKmFHYgdqyJ26V8wnV07ga6vuz5EzTVzU/exec"; 

        window.onload = () => { cargarMemoriaLocal(); iniciarLector(); };

        function cargarMemoriaLocal() {
            try {
                const guardadas = localStorage.getItem('giftcardsDB');
                if (guardadas) baseDeDatosTarjetas = JSON.parse(guardadas);
            } catch (e) { baseDeDatosTarjetas = {}; }
        }

        async function sincronizarDesdeGoogle() {
            try {
                const btnSync = document.querySelector('button[onclick="sincronizarDesdeGoogle()"]');
                btnSync.textContent = "Sincronizando...";
                const respuestaTarjetas = await fetch(URL_GOOGLE_SHEET_TARJETAS);
                const datosCSV = await respuestaTarjetas.text();
                const lineas = datosCSV.replace(/\r/g, '').split('\n');
                for (let i = 1; i < lineas.length; i++) {
                    const lineaActual = lineas[i].trim();
                    if (lineaActual === "") continue;
                    const fila = lineaActual.split(',');
                    if (fila.length >= 3) {
                        const idTarjeta = fila[0].trim();
                        if (idTarjeta) {
                            baseDeDatosTarjetas[idTarjeta] = {
                                id: idTarjeta, monto_inicial: parseFloat(fila[1].trim()),
                                saldo_actual: parseFloat(fila[1].trim()), vencimiento: fila[2].trim(), historial_compras: []
                            };
                        }
                    }
                }
                try {
                    const respuestaTx = await fetch(URL_APPS_SCRIPT_TRANSACCIONES);
                    const transaccionesNube = await respuestaTx.json();
                    transaccionesNube.forEach(tx => {
                        if (baseDeDatosTarjetas[tx.id]) {
                            baseDeDatosTarjetas[tx.id].historial_compras.push(tx);
                            baseDeDatosTarjetas[tx.id].saldo_actual -= tx.monto;
                        }
                    });
                } catch (e) { console.log("Trabajando local."); }

                localStorage.setItem('giftcardsDB', JSON.stringify(baseDeDatosTarjetas));
                btnSync.innerHTML = "🔄 Sincronizar Tarjetas";
                alert(`✅ Sincronización exitosa.`);
            } catch (error) {
                alert("❌ Error de conexión al sincronizar.");
                document.querySelector('button[onclick="sincronizarDesdeGoogle()"]').innerHTML = "🔄 Sincronizar Tarjetas";
            }
        }

        function iniciarLector() {
            if (typeof Html5QrcodeScanner === 'undefined') return;
            try {
                if (!html5QrcodeScanner) {
                    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: { width: 220, height: 220 } }, false);
                    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
                }
            } catch (e) {}
        }
        function onScanFailure(error) {}
        function onScanSuccess(decodedText) {
            if (escaneoPausado) return;
            escaneoPausado = true;
            if (html5QrcodeScanner) html5QrcodeScanner.pause(true); 
            validarTarjeta(decodedText);
        }

        function cerrarModal() {
            modalOverlay.style.display = 'none'; tarjetaActualId = null;
            document.getElementById('charge-amount').value = '';
            if (html5QrcodeScanner) html5QrcodeScanner.resume();
            setTimeout(() => { escaneoPausado = false; }, 1000);
        }
        window.onclick = function(event) { if (event.target === modalOverlay) cerrarModal(); }

        function validarTarjeta(textoDecodificado) {
            try {
                let idTarjeta = "";
                try {
                    const datosQR = JSON.parse(textoDecodificado);
                    idTarjeta = datosQR.id_tarjeta ? datosQR.id_tarjeta.toString().trim() : textoDecodificado.trim();
                } catch (e) { idTarjeta = textoDecodificado.trim(); }
                let tarjeta = baseDeDatosTarjetas[idTarjeta];
                if (!tarjeta) return mostrarModal('error', '❌ Tarjeta no encontrada.', null);
                
                const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
                const fechaVen = new Date(tarjeta.vencimiento + "T00:00:00");
                if (hoy > fechaVen) return mostrarModal('error', `🚨 TARJETA VENCIDA`, tarjeta);
                if (tarjeta.saldo_actual <= 0) return mostrarModal('error', `⚠️ TARJETA AGOTADA`, tarjeta);

                tarjetaActualId = idTarjeta;
                mostrarModal('ok', '✅ TARJETA VÁLIDA', tarjeta);
            } catch (error) { mostrarModal('error', '⚠️ Error al leer QR.', null); }
        }

        function mostrarModal(tipo, mensaje, tarjeta) {
            resultadoBox.className = tipo === 'ok' ? 'ok' : 'error';
            resultadoBox.innerHTML = mensaje;
            if (tarjeta) {
                document.getElementById('dato-id').textContent = tarjeta.id;
                document.getElementById('dato-inicial').textContent = tarjeta.monto_inicial;
                document.getElementById('dato-vencimiento').textContent = tarjeta.vencimiento;
                document.getElementById('dato-saldo').textContent = tarjeta.saldo_actual;
                infoTarjetaBox.style.display = (tarjeta.saldo_actual > 0 && tipo === 'ok') ? 'block' : 'none';
            } else { infoTarjetaBox.style.display = 'none'; }
            modalOverlay.style.display = 'flex';
        }

        async function cobrarSaldo() {
            const inputMonto = document.getElementById('charge-amount');
            const montoCobro = parseFloat(inputMonto.value);
            if (!tarjetaActualId || !baseDeDatosTarjetas[tarjetaActualId]) return;
            let tarjeta = baseDeDatosTarjetas[tarjetaActualId];
            if (!montoCobro || montoCobro <= 0) return alert("Ingrese un monto válido.");
            if (montoCobro > tarjeta.saldo_actual) return alert("El monto supera el saldo.");

            const confirmar = confirm(`¿Confirmas el descuento de $${montoCobro}?`);
            if (!confirmar) return; 

            tarjeta.saldo_actual -= montoCobro;
            const nuevaCompra = { id: tarjeta.id, fecha: new Date().toLocaleString(), timestamp: Date.now(), monto: montoCobro, saldo_restante: tarjeta.saldo_actual };
            tarjeta.historial_compras.push(nuevaCompra);
            localStorage.setItem('giftcardsDB', JSON.stringify(baseDeDatosTarjetas));
            guardarEnNube(nuevaCompra);
            alert(`✅ Cobro exitoso. Nuevo saldo: $${tarjeta.saldo_actual}`);
            cerrarModal(); 
        }

        async function guardarEnNube(compraData) {
            try {
                await fetch(URL_APPS_SCRIPT_TRANSACCIONES, { method: 'POST', mode: 'no-cors', body: JSON.stringify(compraData), headers: { "Content-Type": "text/plain;charset=utf-8" }});
            } catch(error) {}
        }

        function mostrarHistorial() {
            document.getElementById('panel-escaneo').style.display = 'none';
            document.getElementById('historial-panel').style.display = 'block';
            document.getElementById('btn-volver').style.display = 'block';
            const contenedor = document.getElementById('lista-tarjetas');
            contenedor.innerHTML = "";
            const keys = Object.keys(baseDeDatosTarjetas);
            if (keys.length === 0) return contenedor.innerHTML = "<p>Sin tarjetas registradas.</p>";

            keys.forEach(k => {
                const t = baseDeDatosTarjetas[k];
                let historialHtml = t.historial_compras.length > 0 
                    ? "<ul>" + t.historial_compras.map(c => `<li>${c.fecha}: -$${c.monto}</li>`).join('') + "</ul>" : "<i>Sin movimientos</i>";
                const div = document.createElement('div');
                div.style.cssText = "border: 1px solid #ddd; padding: 12px; margin-bottom: 10px; border-radius: 8px; background: #fafafa;";
                div.innerHTML = `<strong>Tarjeta: ${t.id}</strong><br>Monto Inicial: $${t.monto_inicial} | Vence: ${t.vencimiento}<br>
                    <span style="color: ${t.saldo_actual > 0 ? 'green' : 'red'}; font-weight: bold;">Saldo Actual: $${t.saldo_actual}</span>
                    <div style="font-size: 0.85rem; margin-top: 5px;">Historial: ${historialHtml}</div>`;
                contenedor.appendChild(div);
            });
        }

        function cerrarHistorial() {
            document.getElementById('historial-panel').style.display = 'none';
            document.getElementById('btn-volver').style.display = 'none';
            document.getElementById('panel-escaneo').style.display = 'block';
            cerrarModal();
        }

        async function exportarReporte(formato) {
            const btnActual = formato === 'csv' ? document.getElementById('btn-csv') : document.getElementById('btn-pdf');
            const textoOriginal = btnActual.innerText;
            
            btnActual.innerText = "⌛ Procesando...";
            btnActual.disabled = true;

            await new Promise(resolve => setTimeout(resolve, 150));

            try {
                const filtro = document.getElementById('filtro-tiempo').value;
                const ahora = new Date();
                const limiteInicio = new Date();
                
                if (filtro === 'hoy') limiteInicio.setHours(0,0,0,0);
                else if (filtro === 'semana') limiteInicio.setDate(ahora.getDate() - 7);
                else if (filtro === 'quincena') limiteInicio.setDate(ahora.getDate() - 15);
                else if (filtro === 'mes') limiteInicio.setMonth(ahora.getMonth() - 1);
                else limiteInicio.setTime(0);

                let datosReporte = [];
                let totalDescontado = 0;

                for (const id in baseDeDatosTarjetas) {
                    const tarjeta = baseDeDatosTarjetas[id];
                    tarjeta.historial_compras.forEach(compra => {
                        let fechaCompra = compra.timestamp ? new Date(compra.timestamp) : new Date();
                        if (fechaCompra >= limiteInicio) {
                            datosReporte.push([ tarjeta.id, compra.fecha, `$${compra.monto.toFixed(2)}`, `$${tarjeta.saldo_actual.toFixed(2)}` ]);
                            totalDescontado += compra.monto;
                        }
                    });
                }

                if (datosReporte.length === 0) return alert("No hay transacciones registradas en este periodo.");
                const fileName = `Reporte_GiftCards_${filtro}_${ahora.getTime()}`;

                if (formato === 'csv') {
                    let csvContent = "ID Tarjeta,Fecha de Compra,Monto Descontado,Saldo Restante\n";
                    datosReporte.forEach(row => { csvContent += `"${row[0]}","${row[1]}","${row[2]}","${row[3]}"\n`; });
                    csvContent += `\n,,TOTAL DESCONTADO:, "$${totalDescontado.toFixed(2)}"\n`;
                    const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                    const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
                    await compartirArchivoNativo(blob, `${fileName}.csv`);
                } else {
                    if (!window.jspdf) throw new Error('Librería jsPDF no detectada.');
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.setFontSize(16); doc.text(`Reporte de Ventas Gift Cards`, 14, 15);
                    doc.setFontSize(10); doc.text(`Generado: ${ahora.toLocaleString()}`, 14, 22);
                    doc.autoTable({ startY: 28, head: [['ID Tarjeta', 'Fecha', 'Descontado', 'Saldo']], body: datosReporte, theme: 'striped' });
                    const pdfBuffer = doc.output('arraybuffer');
                    const blob = new Blob([pdfBuffer], { type: 'application/pdf' });
                    await compartirArchivoNativo(blob, `${fileName}.pdf`);
                }
            } catch (error) {
                alert("❌ Error interno: " + error.message);
            } finally {
                btnActual.innerText = textoOriginal;
                btnActual.disabled = false;
            }
        }

        async function compartirArchivoNativo(blob, fileName) {
            try {
                if (window.Capacitor && window.Capacitor.isNative) {
                    
                    // Puente V8 Definitivo: Capacitor moderno registra los plugins a través del objeto Plugins o registerPlugin
                    const Filesystem = window.Capacitor.Plugins.Filesystem || window.Capacitor.registerPlugin('Filesystem');
                    const Share = window.Capacitor.Plugins.Share || window.Capacitor.registerPlugin('Share');

                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader(); 
                        reader.onerror = () => reject(new Error("Error leyendo el archivo."));
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.readAsDataURL(blob);
                    });
                    
                    const writeResult = await Filesystem.writeFile({ 
                        path: fileName, 
                        data: base64Data, 
                        directory: 'CACHE' 
                    });
                    
                    await Share.share({
                        title: 'Reporte de Ventas', 
                        text: `Adjunto el reporte de Gift Cards.`,
                        url: writeResult.uri, 
                        dialogTitle: 'Compartir con...'
                    });
                } else {
                    const url = URL.createObjectURL(blob); 
                    const a = document.createElement("a");
                    a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); 
                    document.body.removeChild(a); URL.revokeObjectURL(url);
                }
            } catch (err) { alert("❌ Error compartiendo: " + err.message); }
        }
    </script>
</body>
</html>
